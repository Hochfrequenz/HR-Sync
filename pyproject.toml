[project]
name = "hochfrequenz-hr-sync"
description = "Rolls out the master data of new employees from Personio to weclapp and Decidalo"
license = { text = "MIT" }
# <3.15: personio-client and decidalo-client require aiohttp<3.14, which has no wheels for Python 3.15
requires-python = ">=3.11,<3.15"
authors = [{ name = "Hochfrequenz Unternehmensberatung GmbH", email = "info@hochfrequenz.de" }]
keywords = ["personio", "weclapp", "decidalo", "hr", "onboarding", "sync"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
# the clients are 0.x versions, whose minor versions may contain breaking changes, so we keep an upper bound
dependencies = [
    "decidalo-client>=0.3.1,<0.4",
    "loguru>=0.7",
    "personio-client>=0.1.0a1,<0.2",
    "pydantic>=2.11",
    "pydantic-settings>=2.7",
    "weclapp-client>=0.1.0a1,<0.2",
]
dynamic = ["readme", "version"]

[project.scripts]
hr-sync = "hr_sync.cli:main"

[project.urls]
Homepage = "https://github.com/Hochfrequenz/HR-Sync"

[dependency-groups]
tests = ["pytest==9.1.1"]
linting = [{ include-group = "tests" }, "ruff==0.17.2"]
type_check = [{ include-group = "tests" }, "mypy==2.4.0"]
spell_check = ["codespell==2.4.3"]
coverage = [{ include-group = "tests" }, "coverage==7.17.0"]
# build/twine are only needed to build & publish this package to PyPI, not by users installing it, so they live
# here rather than as a pip-installable extra.
packaging = ["build==1.6.1", "twine==7.0.0"]
dev = [
    { include-group = "tests" },
    { include-group = "linting" },
    { include-group = "type_check" },
    { include-group = "spell_check" },
    { include-group = "coverage" },
    "pre-commit",
]

[tool.uv]
# don't auto-include the "dev" group in every `uv sync`/`uv run` invocation, so that CI jobs can pull in just the
# one group they need (e.g. `uv run --group linting ...`) without also installing every other tool.
default-groups = []

[tool.ruff]
line-length = 120
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "N", "PL", "RUF"]
ignore = [
    "PLR0913", # too-many-arguments
    "PLR0917", # too-many-positional-arguments
    "PLR0912", # too-many-branches
    "PLR0915", # too-many-statements
    "PLR2004", # magic-value-comparison
]

[tool.mypy]
disable_error_code = []
plugins = ["pydantic.mypy"]

# lets mypy catch misspelled or missing keyword arguments of pydantic models, which pydantic itself would ignore
[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

[build-system]
requires = ["hatchling>=1.29.0", "hatch-vcs", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"
fragments = [{ path = "README.md" }]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/_hr_sync_version.py"
template = '''
version = "{version}"
'''

[tool.hatch.build.targets.sdist]
exclude = ["/unittests"]

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]
